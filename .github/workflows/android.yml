
name: CodeForge AI - Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Mostrar ambiente
        run: |
          java -version
          gradle --version

      - name: Compilar APK Debug
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verificar APK gerado
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK compilado:"
          ls -lh "$APK"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CodeForgeAI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
