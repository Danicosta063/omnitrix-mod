
name: CodeForge AI - Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: Android SDK nao encontrado."
            exit 1
          fi

          echo "Android SDK encontrado."

          ls -la "$ANDROID_HOME"

      - name: Localizar SDK Manager
        id: sdkmanager
        shell: bash
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDK_MANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDK Manager: $SDK_MANAGER"
          echo "path=$SDK_MANAGER" >> "$GITHUB_OUTPUT"

      - name: Aceitar licencas Android
        shell: bash
        run: |
          yes | "${{ steps.sdkmanager.outputs.path }}" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          "${{ steps.sdkmanager.outputs.path }}" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Mostrar ambiente
        run: |
          java -version
          gradle --version
          ls "$ANDROID_HOME/platforms"

      - name: Compilar APK Debug
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verificar APK gerado
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK compilado com sucesso!"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeForgeAI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
