# Memória pro Gradle rodar bem na nuvem do GitHub Actions
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Paralelismo e cache — acelera o build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX (obrigatório pra usar ML Kit e bibliotecas modernas)
android.useAndroidX=true

# Non-transitive R classes — evita conflito de IDs entre módulos
android.nonTransitiveRClass=true

# Reduz warnings que poluem o log do build
android.builder.sdkDownload=false
